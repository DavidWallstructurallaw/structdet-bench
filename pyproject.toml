[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "structdet-bench"
version = "0.1.0"
description = "Offline benchmark toolkit for LLM output diversity: task-relative structural support, concentration, registered comparisons and longitudinal analysis"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = []
keywords = ["llm-evaluation", "output-diversity", "structural-diversity", "benchmark", "synthetic-data", "reproducible-research"]
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt", "LICENSING_NOTES.md", "THIRD_PARTY_NOTICES.md", "THEORY_SOURCES.md"]

[project.urls]
Homepage = "https://github.com/DavidWallstructurallaw/structdet-bench"
Documentation = "https://github.com/DavidWallstructurallaw/structdet-bench#readme"
Repository = "https://github.com/DavidWallstructurallaw/structdet-bench"
Issues = "https://github.com/DavidWallstructurallaw/structdet-bench/issues"
Releases = "https://github.com/DavidWallstructurallaw/structdet-bench/releases"

[tool.setuptools]
packages = ["structdet_bench"]
include-package-data = false
