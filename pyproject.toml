[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "structdet-bench"
version = "0.1.0"
description = "Offline structural measurement, comparison, longitudinal analysis and passive study toolkit"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = []
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt", "LICENSING_NOTES.md", "THIRD_PARTY_NOTICES.md", "THEORY_SOURCES.md"]

[tool.setuptools]
packages = ["structdet_bench"]
include-package-data = false
